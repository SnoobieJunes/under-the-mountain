; [2026-11-01 T-048] Model Context Protocol (unreal-mcp) server defaults.
; Why this file exists: bAutoStartServer was previously set only in
; Saved/Config/MacEditor/EditorPerProjectUserSettings.ini - machine-local,
; gitignored state that a fresh clone, a cleaned Saved/, or another Mac
; silently loses, after which the editor opens with no MCP listener on
; :8000 and every capture session fails for a confusing reason. Shipping
; the default here makes a fresh Scripts/run-editor.sh launch serve MCP
; with no manual step. Saved/ user settings still override per machine.
; One listener per machine: only the FIRST editor instance can bind
; port 8000; a second instance's server start fails and its log says so.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
ServerPortNumber=8000
bAutoStartServer=True
