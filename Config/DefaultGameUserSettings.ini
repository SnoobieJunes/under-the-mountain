; Under the Mountain — game user settings defaults. [2026-11-04 T-128]
; Shipped default = highest authored quality (Ultra, owner pick
; 2026-11-03): every sg.* group at 3 (Epic) and full resolution scale.
; Lower presets (Low/Medium/High) are applied live from the Settings
; screen via UGameUserSettings + the sg.* cvars — see
; Source/UnderTheMountain/Public/UI/GraphicsQualityPreset.h. UE copies
; these defaults into the per-user GameUserSettings.ini on first run;
; after that the player's saved preset wins.

[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
