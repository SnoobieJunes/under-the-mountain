; Under the Mountain — project settings. [2026-10-27 T-002]
; [2026-10-27 T-003] GameFeatureData scan rule: AllToolsets pulls in the
; GameFeatures plugin, whose data type the asset manager refuses to start
; without a scan rule (error on every editor launch, commandlet exit 1).
; [2026-10-28 T-045] The scan directory is /Game/GameFeatures ONLY, not
; the whole /Game tree: scanning everything registered every asset as a
; GameFeatureData primary asset, so duplicate filenames across folders
; (Material_0 in Meshy/Dragon, Meshy/Thieves, Raw/Thieves...) produced
; 100 "duplicate PrimaryAssetID" warnings per launch. No GameFeatureData
; assets exist in this project; real ones belong under /Game/GameFeatures.
[/Script/Engine.AssetManagerSettings]
PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClassName="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/GameFeatures")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Under the Mountain
Description=Open-world dragon simulator. You are the dragon. (Meta AI Developer Hackathon 2026, Indie track.)
ProjectVersion=0.1.0
CompanyName=Auston
